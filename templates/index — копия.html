<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юридический ИИ-Консультант</title>
    <!-- Подключаем стили (CSS) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Подключаем иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1><i class="fas fa-balance-scale"></i> Юридический Консультант</h1>
            <div class="status">
                <span class="status-dot"></span> Онлайн
            </div>
        </header>

        <!-- Область чата -->
        <div class="chat-area" id="chat-area">
            <!-- Сообщения будут появляться здесь -->
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="text">
                    Здравствуйте! Я ваш виртуальный юрист.<br>
                    Расскажите вашу ситуацию, и я постараюсь помочь.
                </div>
            </div>
        </div>

        <!-- Поле ввода -->
        <div class="input-area">
            <textarea id="message-input" placeholder="Введите ваш вопрос здесь..." rows="3"></textarea>
            <button id="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Подключаем скрипт (JavaScript) -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
