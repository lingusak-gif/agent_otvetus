<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Юридический Консультант</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #495057; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .password-hint { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
        button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #218838; }
        .error { background: #fff3f3; color: #c00; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #c00; }
        .links { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .links a { color: #007bff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>📝 Регистрация</h2>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Латиница, 3-20 символов" pattern="[a-zA-Z0-9_]{3,20}" title="Только латинские буквы, цифры и подчёркивание">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Минимум 8 символов" minlength="8" oninput="checkPassword()">
                <div class="password-hint" id="passwordHint">Мин. 8 символов</div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Повторите пароль" oninput="checkMatch()">
                <div class="password-hint" id="matchHint"></div>
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        
        <div class="links">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pwd = document.getElementById('password').value;
            const hint = document.getElementById('passwordHint');
            if (pwd.length >= 8) {
                hint.textContent = '✓ Достаточная длина';
                hint.style.color = '#28a745';
            } else {
                hint.textContent = 'Мин. 8 символов';
                hint.style.color = '#6c757d';
            }
        }
        function checkMatch() {
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const hint = document.getElementById('matchHint');
            if (confirm && pwd !== confirm) {
                hint.textContent = '❌ Пароли не совпадают';
                hint.style.color = '#c00';
            } else if (confirm) {
                hint.textContent = '✓ Пароли совпадают';
                hint.style.color = '#28a745';
            } else {
                hint.textContent = '';
            }
        }
        function validateForm() {
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (pwd.length < 8) {
                alert('Пароль должен быть не менее 8 символов');
                return false;
            }
            if (pwd !== confirm) {
                alert('Пароли не совпадают');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
